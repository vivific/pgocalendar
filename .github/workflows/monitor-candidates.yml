name: Build monitor candidate manifest

on:
  push:
    branches: [main]
    paths:
      - 'data/calendar_events.json'
      - 'data/processed_posts.json'
      - 'scripts/monitor_candidates.py'
      - '.github/workflows/monitor-candidates.yml'
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-candidate-manifest
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load previous monitor-state baseline
        shell: bash
        run: |
          printf '{}\n' > /tmp/previous_monitor_candidates.json
          printf '{}\n' > /tmp/previous_article_snapshots.json
          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch origin monitor-state:refs/remotes/origin/monitor-state
            git show origin/monitor-state:monitor_candidates.json > /tmp/previous_monitor_candidates.json 2>/dev/null || true
            git show origin/monitor-state:article_snapshots.json > /tmp/previous_article_snapshots.json 2>/dev/null || true
            echo "Loaded previous monitor-state baselines."
          fi

      - name: Build deterministic source snapshot and candidate payloads from main
        shell: bash
        run: |
          rm -rf /tmp/monitor-state
          mkdir -p /tmp/monitor-state/monitor_payloads
          CAL_SHA="$(git rev-parse HEAD:data/calendar_events.json)"
          PROC_SHA="$(git rev-parse HEAD:data/processed_posts.json)"
          python scripts/monitor_candidates.py \
            --output /tmp/monitor-state/monitor_candidates.json \
            --payload-dir /tmp/monitor-state/monitor_payloads \
            --snapshots-output /tmp/monitor-state/article_snapshots.json \
            --previous-manifest /tmp/previous_monitor_candidates.json \
            --previous-snapshots /tmp/previous_article_snapshots.json \
            --calendar-sha "$CAL_SHA" \
            --processed-sha "$PROC_SHA"

      - name: Validate manifest and candidate payload integrity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/monitor-state')
          manifest_path = root / 'monitor_candidates.json'
          data = json.loads(manifest_path.read_text(encoding='utf-8'))

          required = {
              'schema_version', 'payload_schema_version', 'generated_at',
              'source_snapshot_at', 'calendar_blob_sha', 'processed_blob_sha',
              'complete', 'locale_failures', 'locale_states',
              'index_snapshot_sha256', 'index_slugs', 'discovery_index_slugs', 'new', 'recheck',
              'unresolved_new', 'blocked_by_canonical', 'article_fingerprints',
              'article_snapshots_path', 'article_snapshots_sha256'
          }
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit(f'Manifest missing required fields: {missing}')
          if data['schema_version'] != 2:
              raise SystemExit(f"Unexpected schema_version: {data['schema_version']}")
          if data['payload_schema_version'] != 1:
              raise SystemExit(f"Unexpected payload_schema_version: {data['payload_schema_version']}")

          snapshots = root / data['article_snapshots_path']
          if not snapshots.is_file():
              raise SystemExit(f'Missing article snapshots file: {snapshots}')
          if hashlib.sha256(snapshots.read_bytes()).hexdigest() != data['article_snapshots_sha256']:
              raise SystemExit('article_snapshots.json hash mismatch')

          for queue in ('new', 'recheck'):
              for item in data[queue]:
                  slug = item.get('slug')
                  rel = item.get('payload_path')
                  expected = item.get('payload_sha256')
                  if not rel or not expected:
                      raise SystemExit(f'{queue} candidate {slug!r} is missing payload metadata')
                  path = root / rel
                  if not path.is_file():
                      raise SystemExit(f'{queue} candidate {slug!r} payload missing: {rel}')
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != expected:
                      raise SystemExit(f'{queue} candidate {slug!r} payload hash mismatch')
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  if payload.get('schema_version') != data['payload_schema_version']:
                      raise SystemExit(f'{queue} candidate {slug!r} payload schema mismatch')
                  if payload.get('slug') != slug or payload.get('classification') != queue:
                      raise SystemExit(f'{queue} candidate {slug!r} payload identity mismatch')
                  if queue == 'recheck' and payload.get('article_changed') is not True:
                      raise SystemExit(f'recheck candidate {slug!r} lacks article_changed=true')
                  article = payload.get('current_article') or {}
                  text = article.get('text')
                  content_hash = article.get('content_sha256')
                  if not isinstance(text, str) or not text or not content_hash:
                      raise SystemExit(f'{queue} candidate {slug!r} lacks current article text/hash')
                  if hashlib.sha256(text.encode('utf-8')).hexdigest() != content_hash:
                      raise SystemExit(f'{queue} candidate {slug!r} current article hash mismatch')
          PY

      - name: Publish source state and payloads to monitor-state branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/monitor-state; then
            git checkout -B monitor-state origin/monitor-state
          else
            git checkout --orphan monitor-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf monitor_payloads
          mkdir -p monitor_payloads
          cp /tmp/monitor-state/monitor_candidates.json monitor_candidates.json
          cp /tmp/monitor-state/article_snapshots.json article_snapshots.json
          cp -a /tmp/monitor-state/monitor_payloads/. monitor_payloads/

          git add -A monitor_candidates.json article_snapshots.json monitor_payloads
          git commit -m "Update monitor source snapshot"
          git push origin monitor-state

      - name: Fail run if locale discovery was incomplete
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/monitor-state/monitor_candidates.json')
          if not path.exists():
              raise SystemExit('No monitor manifest was produced.')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not data.get('complete'):
              raise SystemExit(f"Incomplete source discovery: {data.get('locale_failures', {})}")
          PY
