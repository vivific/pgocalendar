name: Build monitor candidate manifest
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic candidate manifest
        run: python scripts/monitor_candidates.py --output monitor_candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-candidates
          path: monitor_candidates.json
          retention-days: 7
