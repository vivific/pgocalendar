name: Monitor source freshness watchdog

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify latest monitor-state snapshot
        shell: bash
        run: |
          git fetch origin monitor-state:refs/remotes/origin/monitor-state
          git show origin/monitor-state:monitor_candidates.json > /tmp/monitor_candidates.json
          test "$(jq -r '.schema_version' /tmp/monitor_candidates.json)" = "2"
          test "$(jq -r '.complete' /tmp/monitor_candidates.json)" = "true"
          test "$(jq '.locale_failures | length' /tmp/monitor_candidates.json)" = "0"
          STAMP="$(jq -r '.source_snapshot_at' /tmp/monitor_candidates.json)"
          test -n "$STAMP"
          NOW="$(date -u +%s)"
          THEN="$(date -u -d "$STAMP" +%s)"
          AGE_MIN="$(( (NOW - THEN) / 60 ))"
          echo "Source snapshot age: \${AGE_MIN} minutes"
          test "$AGE_MIN" -le 40
